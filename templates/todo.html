<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Dashboard</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Todo Dashboard</h1>

        <button id="logoutBtn">Logout</button>

        <hr>

        <!-- Create Todo -->
        <h2>Add Todo</h2>

        <form id="todoForm">

            <input
                type="text"
                id="work"
                placeholder="Enter your task"
                required
            >

            <label>
                <input
                    type="checkbox"
                    id="completed"
                >
                Completed
            </label>

            <button type="submit">
                Add Todo
            </button>

        </form>

        <p id="message"></p>

        <hr>

        <!-- Todo List -->
        <h2>My Todos</h2>

        <div id="todoList"></div>

    </div>

    <script src="/static/js/todo.js"></script>

</body>
</html>
